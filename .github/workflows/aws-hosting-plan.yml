name: Guardian AWS hosting template

on:
  pull_request:
    branches: [main]
    paths: ["infra/aws-staging/**", ".github/workflows/aws-hosting-plan.yml"]
  push:
    branches: [main]
    paths: ["infra/aws-staging/**", ".github/workflows/aws-hosting-plan.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Lint the prepared hosting template without AWS credentials
        run: |
          python -m pip install --disable-pip-version-check "cfn-lint==1.57.2"
          cfn-lint infra/aws-staging/runtime.json
